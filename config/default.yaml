# The parameters of your project. Committed, reviewed, and changed in a commit with a reason —
# a change here changes your results, so it belongs in the history like any other change.
#
# Every scientific parameter goes here, with units in a comment where they are not obvious.
# Nothing in src/ should contain a number a reviewer could ask "why that value?" about.

seed: 20260101          # fixes every random draw; recorded in run_metadata.json

# Week 3 toy tissue
n_cells: 20
field_width_um: 320.0
field_height_um: 320.0
square_size_um: 2.0
cell_types:
  - type_a
  - type_b

# Week 5 Expression programs
n_genes: 100 # Total number of distinct genes in the simulation
n_marker_genes: 10 # Number of marker genes assigned to each cell type
marker_boost: 5.0 # Controls how the expression of genes is distributed
baseline_spread: 1.0 # Controls how many transcripts you expect to capture from each cell