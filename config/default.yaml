# The parameters of your project. Committed, reviewed, and changed in a commit with a reason —
# a change here changes your results, so it belongs in the history like any other change.
#
# Every scientific parameter goes here, with units in a comment where they are not obvious.
# Nothing in src/ should contain a number a reviewer could ask "why that value?" about.

seed: 20260101          # fixes every random draw; recorded in run_metadata.json

# Tissue geometry and number of cells
n_cells: 300
field_width_um: 320.0
field_height_um: 320.0
square_size_um: 2.0

# Expression programs
n_genes: 100 # Total number of distinct genes
n_marker_genes: 10 # Number of marker genes per cell type
marker_boost: 10.0 # Multiplicative factor applied to marker genes
baseline_spread: 1.0 # Standard deviation of the log-normal distribution
cell_types:
  - type_a
  - type_b


# Cell placement (place_cells)
cell_radius_um: 7.5           # radius of each round cell in µm
distribution_shape: uniform     # uniform | gaussian | clustered

# Spatial domains: rows are domains; columns follow cell_types order.
n_domains: 2
domain_probabilities:
  - [0.8, 0.2]
  - [0.2, 0.8]
  
# Mean number of captured transcripts per cell [type_a, type_b]
mean_transcripts_per_type: [600.0, 1200.0]  
# Independent profiled reference cells per type; contract recommends at least ~50.
reference_n_per_type: 80

# Reference sequencing depth multiplier (dimensionless)
sequencing_depth: 1.0

# Cell placement parameters
gaussian_spread_divisor: 6.0 # Divide each field dimension by this for the Gaussian SD.
cluster_spread_divisor: 15.0 # Divide each field dimension by this for the within-cluster SD.
min_clusters: 2
cluster_count_divisor: 2.0 # Divide sqrt(n_cells) by this before rounding down.
max_attempts_per_cell: 200 # Total candidate limit = n_cells times this value.
